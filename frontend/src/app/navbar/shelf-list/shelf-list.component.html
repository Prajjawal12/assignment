<table *ngIf="shelves.length > 0 && shelves">
    <thead>
        <tr>
            <th *ngFor="let column of columns">{{column}}</th>
        </tr>

    </thead>

    <tbody>
        <tr *ngFor="let shelf of shelves">
            <!-- <td>{{shelf.id}}</td> -->
            <td>{{shelf.id}}</td>
            <td>{{shelf.name}}</td>
            <td>{{shelf.shelfType}}</td>
        </tr>
    </tbody>
</table>
