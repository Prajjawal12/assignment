<table *ngIf="devices && devices.length > 0">
    <thead>
        <tr>
            <th *ngFor="let column of columns">{{column}}</th>
        </tr>

    </thead>


    <tbody>
        <tr *ngFor="let device of devices">
            <td>{{device.id}}</td>
            <td>{{device.name}}</td>
            <td>{{device.deviceType}}</td>
        </tr>
    </tbody>
</table>


<div *ngIf="devices.length === 0 || !devices">
    <p>No devices present in database!</p>
</div>
